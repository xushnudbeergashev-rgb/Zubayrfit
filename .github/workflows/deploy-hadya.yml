# hadya_worker/dist/worker.js o'zgarsa, uni Cloudflare'dagi worker'ga avtomatik joylaydi.
# Faqat kod almashtiriladi: D1 baza, o'zgaruvchilar, secret'lar va cron o'zgarmaydi.
# Kerakli GitHub secret'lari: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID, CF_WORKER_NAME.
name: Deploy hadya worker

on:
  push:
    branches: [main, claude/admiring-ritchie-mry13c]
    paths: [hadya_worker/dist/worker.js, .github/workflows/deploy-hadya.yml]
  workflow_dispatch:

concurrency: deploy-hadya

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Upload worker code
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_WORKER: ${{ secrets.CF_WORKER_NAME }}
        run: |
          if [ -z "$CF_TOKEN" ] || [ -z "$CF_ACCOUNT" ] || [ -z "$CF_WORKER" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID yoki CF_WORKER_NAME secret'i yo'q"
            exit 1
          fi
          res=$(curl -sS -X PUT \
            "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/workers/scripts/$CF_WORKER/content" \
            -H "Authorization: Bearer $CF_TOKEN" \
            -F 'metadata={"main_module":"worker.js"};type=application/json' \
            -F "worker.js=@hadya_worker/dist/worker.js;filename=worker.js;type=application/javascript+module")
          echo "$res" | jq '{success, errors}'
          [ "$(echo "$res" | jq -r .success)" = "true" ]
