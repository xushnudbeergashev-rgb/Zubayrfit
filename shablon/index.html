<!-- Mijozga topshirishda faqat tanlangan dizayn shriftlarini qoldiring:
     yashil: Unbounded + Manrope · olov: Dela Gothic One + Golos Text · rishton: Prata + Golos Text -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Golos+Text:wght@400;600;700&family=Manrope:wght@400;600;800&family=Prata&family=Unbounded:wght@600;800&display=swap">
<style>
/* Layout: mobile-first, photo-led. Demo switcher → promo strip → top bar → hero (text, photo, actions) → facts → "most ordered" photo rail → combo banner → sticky category chips → menu photo cards → how-to-order steps → reviews → location → footer with photo credits. Cart bar fixed at bottom; product and order sheets slide up over an inert page.
   Three designs share one structure: yashil (fresh market), olov (street-food poster), rishton (cobalt ceramics, arch-shaped photos). */
:root{
  --bg:#F7F8F3; --surface:#FFFFFF; --surface2:#EEF2E8; --ink:#16241B; --muted:#5A6A5F; --line:#DCE3D6;
  --brand:#1F5A3E; --brand-ink:#FFFFFF; --accent:#F2B21B; --accent-ink:#1A1A12; --hot:#C8402A; --fill:#2F7D47;
  --combo:#1F5A3E; --combo-ink:#FFFFFF; --tag-ink:#FFFFFF; --focus:#16241B;
  --display:"Unbounded","Arial Black",system-ui,sans-serif; --body:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:20px; --r-sm:12px; --ph-r:16px; --hero-r:28px; --h1:clamp(40px,11vw,74px); --h1-track:-.035em; --bw:1.5px;
  --shadow:0 1px 2px rgba(22,36,27,.06),0 8px 24px -12px rgba(22,36,27,.18);
  color-scheme:light; font-synthesis:none;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1712; --surface:#17221B; --surface2:#1E2C23; --ink:#ECF2EC; --muted:#9FB0A4; --line:#2A3A2F;
  --brand:#4FA078; --brand-ink:#06110B; --accent:#F6C445; --accent-ink:#1A1A12; --hot:#EC6A52; --fill:#6CC07B;
  --combo:#1F5A3E; --combo-ink:#F1F6F1; --tag-ink:#0F1712; --focus:#ECF2EC;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px -12px rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1712; --surface:#17221B; --surface2:#1E2C23; --ink:#ECF2EC; --muted:#9FB0A4; --line:#2A3A2F;
  --brand:#4FA078; --brand-ink:#06110B; --accent:#F6C445; --accent-ink:#1A1A12; --hot:#EC6A52; --fill:#6CC07B;
  --combo:#1F5A3E; --combo-ink:#F1F6F1; --tag-ink:#0F1712; --focus:#ECF2EC;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px -12px rgba(0,0,0,.6); color-scheme:dark}

/* Olov — street-food poster: mustard paper, black ink, tomato red */
:root[data-design="olov"]{
  --bg:#F6CF3E; --surface:#FFF6D6; --surface2:#F1C21F; --ink:#141210; --muted:#4A3F25; --line:#141210;
  --brand:#141210; --brand-ink:#F6CF3E; --accent:#E2381F; --accent-ink:#FFF6D6; --hot:#C42A14; --fill:#2E7A3A;
  --combo:#141210; --combo-ink:#F6CF3E; --tag-ink:#FFF6D6; --focus:#141210;
  --display:"Dela Gothic One","Arial Black",system-ui,sans-serif; --body:"Golos Text",system-ui,-apple-system,sans-serif;
  --r:6px; --r-sm:4px; --ph-r:4px; --hero-r:6px; --h1:clamp(44px,13vw,88px); --h1-track:-.01em; --bw:2.5px;
  --shadow:5px 5px 0 #141210}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"])[data-design="olov"]{
  --bg:#17140D; --surface:#221D12; --surface2:#2C2615; --ink:#F7E7B0; --muted:#C2B07A; --line:#F6CF3E;
  --brand:#F6CF3E; --brand-ink:#17140D; --accent:#F0573D; --accent-ink:#17140D; --hot:#FF7158; --fill:#6CC07B;
  --combo:#F6CF3E; --combo-ink:#17140D; --tag-ink:#17140D; --focus:#F7E7B0;
  --shadow:5px 5px 0 #F6CF3E}}
:root[data-theme="dark"][data-design="olov"]{
  --bg:#17140D; --surface:#221D12; --surface2:#2C2615; --ink:#F7E7B0; --muted:#C2B07A; --line:#F6CF3E;
  --brand:#F6CF3E; --brand-ink:#17140D; --accent:#F0573D; --accent-ink:#17140D; --hot:#FF7158; --fill:#6CC07B;
  --combo:#F6CF3E; --combo-ink:#17140D; --tag-ink:#17140D; --focus:#F7E7B0;
  --shadow:5px 5px 0 #F6CF3E}

/* Rishton — cobalt glaze, white clay, turquoise; photos sit in arches like an iwan */
:root[data-design="rishton"]{
  --bg:#F3F6FB; --surface:#FFFFFF; --surface2:#E3EBF7; --ink:#0F1E3D; --muted:#4F5F7E; --line:#D2DCEC;
  --brand:#1B3F96; --brand-ink:#FFFFFF; --accent:#0F7F7A; --accent-ink:#FFFFFF; --hot:#C2473B; --fill:#0F7F7A;
  --combo:#1B3F96; --combo-ink:#FFFFFF; --tag-ink:#FFFFFF; --focus:#0F1E3D;
  --display:"Prata",Georgia,"Times New Roman",serif; --body:"Golos Text",system-ui,-apple-system,sans-serif;
  --r:22px; --r-sm:14px; --ph-r:999px 999px 14px 14px; --hero-r:999px 999px 28px 28px; --h1:clamp(44px,12vw,82px); --h1-track:0;
  --shadow:0 1px 2px rgba(15,30,61,.06),0 10px 30px -14px rgba(27,63,150,.35)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"])[data-design="rishton"]{
  --bg:#0B1226; --surface:#121C36; --surface2:#182647; --ink:#E7EDFA; --muted:#9CABCB; --line:#24345C;
  --brand:#7EA2F2; --brand-ink:#0B1226; --accent:#42C7C1; --accent-ink:#0B1226; --hot:#F07A6C; --fill:#42C7C1;
  --combo:#1E3F8F; --combo-ink:#FFFFFF; --tag-ink:#0B1226; --focus:#E7EDFA;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px -14px rgba(0,0,0,.7)}}
:root[data-theme="dark"][data-design="rishton"]{
  --bg:#0B1226; --surface:#121C36; --surface2:#182647; --ink:#E7EDFA; --muted:#9CABCB; --line:#24345C;
  --brand:#7EA2F2; --brand-ink:#0B1226; --accent:#42C7C1; --accent-ink:#0B1226; --hot:#F07A6C; --fill:#42C7C1;
  --combo:#1E3F8F; --combo-ink:#FFFFFF; --tag-ink:#0B1226; --focus:#E7EDFA;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px -14px rgba(0,0,0,.7)}

*{box-sizing:border-box}
[hidden]{display:none !important}
html{-webkit-text-size-adjust:100%;scroll-padding-top:72px}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 var(--body);
  padding-bottom:calc(96px + env(safe-area-inset-bottom,0px));transition:background-color .25s,color .25s}
.wrap{max-width:1040px;margin:0 auto;padding-inline:16px}
a{color:inherit}
button{font:inherit;color:inherit}
button:disabled{cursor:not-allowed;opacity:.5}
img{max-width:100%}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:6px}
svg{display:block}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0}
h2{font:800 clamp(26px,6.4vw,38px)/1.05 var(--display);margin:0;text-wrap:balance;letter-spacing:var(--h1-track)}
.sec{margin-top:48px}
.sec-head{display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:10px 16px;margin-bottom:16px}
.sec-head > div{display:grid;gap:6px;min-width:0}

/* Demo strip — only for showing the owner */
.demo{background:var(--ink);color:var(--bg);font-size:13px}
.demo .wrap{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;padding-block:8px}
.demo b{font-weight:700;letter-spacing:.06em;text-transform:uppercase;font-size:11px;opacity:.7}
.demo :focus-visible{outline-color:currentColor}
.demo-note{opacity:.7;font-size:12px}
.seg{display:flex;gap:4px;flex-wrap:wrap}
.seg button{border:1px solid color-mix(in srgb,var(--bg) 35%,transparent);background:transparent;color:var(--bg);
  border-radius:999px;padding:3px 10px;font-size:13px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:6px}
.seg button[aria-pressed="true"]{background:var(--bg);color:var(--ink)}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;border:1px solid color-mix(in srgb,var(--bg) 40%,transparent)}
.demo .spacer{flex:1}

/* Promo strip */
.promo{background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:14px;text-align:center}
.promo .wrap{padding-block:8px}

/* Top bar */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:16px 0}
.logo{display:flex;align-items:center;gap:10px;font:800 15px var(--display);text-decoration:none}
.logo i{width:40px;height:40px;border-radius:var(--r-sm);background:var(--brand);color:var(--brand-ink);display:grid;place-items:center;font-style:normal;font-size:14px}
.status{display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:700;border-radius:999px;padding:6px 12px;
  background:var(--surface);border:var(--bw) solid var(--line)}
.status i{width:8px;height:8px;border-radius:50%;background:var(--fill);box-shadow:0 0 0 4px color-mix(in srgb,var(--fill) 25%,transparent)}
.status.closed i{background:var(--hot);box-shadow:0 0 0 4px color-mix(in srgb,var(--hot) 25%,transparent)}

/* Hero */
.hero{display:grid;gap:18px;padding-block:22px 4px;grid-template-areas:"text" "photo" "act"}
.hero-text{grid-area:text;min-width:0}
.hero-act{grid-area:act;min-width:0}
.hero-photo{grid-area:photo;margin:0;position:relative;min-width:0}
h1{font:800 var(--h1)/.92 var(--display);letter-spacing:var(--h1-track);margin:10px 0 14px;text-wrap:balance}
h1 span{color:var(--hot)}
.lead{font-size:18px;color:var(--muted);margin:0;max-width:36ch;text-wrap:pretty}
.rating{display:inline-flex;flex-wrap:wrap;align-items:center;gap:6px 8px;font-size:14px;color:var(--muted);margin-top:16px;text-decoration:none}
.rating b{color:var(--ink);font-size:16px}
.stars{display:flex;gap:2px;color:var(--accent)}
.stars svg{width:16px;height:16px}
.hero-photo .frame{position:relative;aspect-ratio:5/4;max-width:100%;border-radius:var(--hero-r);overflow:hidden;background:var(--surface2);box-shadow:var(--shadow)}
.hero-photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:var(--hero-focus,50% 50%)}
.sticker{position:absolute;right:8px;top:-14px;background:var(--accent);color:var(--accent-ink);font:800 11.5px/1.05 var(--display);letter-spacing:-.02em;
  text-align:center;width:100px;height:100px;border-radius:50%;display:grid;place-content:center;transform:rotate(12deg);padding:10px;z-index:1;box-shadow:var(--shadow)}
.sticker small{display:block;font:700 10.5px/1.2 var(--body);letter-spacing:0;margin-top:3px}
@media (min-width:760px){
  .hero{grid-template-columns:1.1fr 1fr;grid-template-areas:"text photo" "act photo";column-gap:40px;align-items:center;padding-top:36px}
  .hero-text{align-self:end}.hero-act{align-self:start}
  .hero-photo .frame{aspect-ratio:4/5}
  .sticker{right:-14px;top:-14px;width:108px;height:108px;font-size:12.5px}
}

.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.actions .route{grid-column:1 / -1;min-height:46px;font-size:15px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:52px;border-radius:var(--r-sm);padding:0 16px;
  font-weight:700;text-decoration:none;font-size:16px;border:0;cursor:pointer;text-align:center}
.btn svg{width:20px;height:20px;flex:none}
.btn.primary{background:var(--brand);color:var(--brand-ink)}
.btn.accent{background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:var(--surface);color:var(--ink);border:var(--bw) solid var(--line)}
.btn.small{min-height:44px;font-size:15px}
.btn.link{background:transparent;color:var(--muted);min-height:40px;font-size:14px;text-decoration:underline;text-underline-offset:3px}
.phone{margin:12px 0 0;font-size:14px;color:var(--muted)}
.phone b{color:var(--ink);font-variant-numeric:tabular-nums;user-select:all}

.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:28px}
.fact{background:var(--surface);border:var(--bw) solid var(--line);border-radius:var(--r-sm);padding:12px 14px;min-width:0}
.fact small{display:block;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.fact b{display:block;font:800 18px/1.2 var(--display);margin-top:4px;font-variant-numeric:tabular-nums}
@media (max-width:420px){
  .facts{grid-template-columns:1fr 1fr}
  .fact:last-child{grid-column:1 / -1;display:flex;justify-content:space-between;align-items:baseline;gap:12px}
  .fact:last-child b{margin-top:0}
  .fact{padding:10px 12px}.fact b{font-size:16px}.fact small{font-size:10px}
}

/* Photo frame shared by cards. The category drawing sits under the photo: it shows while the photo loads or if it is missing. */
.ph{display:block;position:relative;overflow:hidden;background:var(--surface2);border-radius:var(--ph-r);border:0;padding:0;cursor:pointer;aspect-ratio:1/1;max-width:100%}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .35s;z-index:1}
.ph svg{position:absolute;inset:18%;width:64%;height:64%;opacity:.5}
div.ph{cursor:default}

/* Most-ordered rail */
.rail{display:grid;grid-auto-flow:column;grid-auto-columns:min(70%,250px);gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;
  padding:4px max(16px,calc((100% - 1008px)/2)) 14px;scroll-padding-inline:max(16px,calc((100% - 1008px)/2));scrollbar-width:none}
.rail::-webkit-scrollbar{display:none}
@media (min-width:1040px){.rail{grid-auto-columns:calc((1008px - 42px)/4)}}
.hit{scroll-snap-align:start;background:var(--surface);border:var(--bw) solid var(--line);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column;min-width:0;box-shadow:var(--shadow)}
.hit .ph{border-radius:0}
.hit .ph:focus-visible{outline-offset:-4px}
.hit .body{padding:12px 14px 14px;display:grid;gap:8px;flex:1}
.hit h3{margin:0;font-size:16px;line-height:1.3}
.hit .row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:auto}
.price{font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}
.tag{display:inline-block;font-size:10.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;
  border-radius:999px;padding:2px 8px;background:var(--hot);color:var(--tag-ink);white-space:nowrap}
.tag.new{background:var(--fill)}
.tag.off{background:var(--muted);color:var(--surface)}
.ph .tag{position:absolute;left:10px;top:10px;z-index:2}

/* Combo banner */
.combo{display:grid;grid-template-columns:1fr;gap:16px;background:var(--combo);color:var(--combo-ink);border-radius:var(--r);padding:20px;position:relative;overflow:hidden}
.combo .stack{display:flex;padding-left:18px}
.combo .stack .ph{width:84px;height:84px;border-radius:50%;margin-left:-18px;border:4px solid var(--combo);flex:none}
.combo h3{font:800 24px/1.1 var(--display);margin:4px 0 6px}
.combo p{margin:0;opacity:.85;font-size:15px}
.combo .eyebrow{color:inherit;opacity:.75}
.combo .buy{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px}
.combo .now{font:800 26px var(--display);font-variant-numeric:tabular-nums}
.combo s{opacity:.7;font-variant-numeric:tabular-nums}
.combo .save{background:var(--accent);color:var(--accent-ink);font-weight:800;font-size:13px;border-radius:999px;padding:3px 10px}
.combo .buy .qty{margin-left:auto}
.combo .qty button{width:48px;height:48px;font-size:24px}
.combo .qty .plus{background:var(--combo-ink);color:var(--combo);box-shadow:0 6px 16px -6px rgba(0,0,0,.45)}
.combo .qty.has{background:var(--combo-ink);border-color:var(--combo-ink);color:var(--combo)}
.combo :focus-visible{outline-color:var(--combo-ink)}
@media (min-width:700px){
  .combo{grid-template-columns:auto 1fr;align-items:center;padding:28px 36px;gap:12px 32px}
  .combo .stack{grid-row:1 / span 2;align-self:center}
  .combo .stack .ph{width:104px;height:104px}
}

/* Category chips */
nav.cats{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:var(--bw) solid var(--line);margin-top:40px}
.cats .wrap{display:flex;gap:8px;overflow-x:auto;padding-block:12px;scrollbar-width:none}
.cats .wrap::-webkit-scrollbar{display:none}
.cats button{flex:none;font-weight:700;font-size:14px;padding:8px 16px;border-radius:999px;cursor:pointer;
  background:var(--surface);border:var(--bw) solid var(--line)}
.cats button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

/* Menu */
.menu-sec{padding-top:28px}
.menu-sec .sec-head{margin-bottom:14px}
.note{font-size:14px;color:var(--muted);margin:0}
.grid{display:grid;gap:12px;grid-template-columns:1fr}
@media (min-width:700px){.grid{grid-template-columns:1fr 1fr}}
.card{display:grid;grid-template-columns:112px 1fr;gap:14px;padding:10px;background:var(--surface);border:var(--bw) solid var(--line);border-radius:var(--r);min-width:0}
.card .ph{width:112px}
.card .txt{display:flex;flex-direction:column;gap:4px;min-width:0;padding-block:2px}
.card h3{margin:0;font-size:16.5px;line-height:1.3}
.card h3 button{all:unset;cursor:pointer}
.card h3 button:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:4px}
.card p{margin:0;color:var(--muted);font-size:14px;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card .row{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px;margin-top:auto;padding-top:6px}
.card h3 .tag{margin-left:6px;vertical-align:2px}
.weight{color:var(--muted);font-weight:600;font-size:13px;margin-left:6px;white-space:nowrap}
.card.off .ph img{filter:grayscale(1);opacity:.6}
.card.off h3,.card.off .price{color:var(--muted)}

.qty{display:flex;align-items:center;gap:2px;background:var(--surface);border:var(--bw) solid var(--line);border-radius:999px;padding:3px;flex:none}
.qty button{width:34px;height:34px;border-radius:50%;border:0;background:transparent;cursor:pointer;font-size:20px;font-weight:700;line-height:1;display:grid;place-items:center}
.qty .plus{background:var(--brand);color:var(--brand-ink)}
.qty span{min-width:20px;text-align:center;font-weight:800;font-variant-numeric:tabular-nums}
.qty:not(.has) .minus,.qty:not(.has) span{display:none}
.qty:not(.has){border-color:transparent;background:transparent}

/* Steps */
.steps{list-style:none;margin:0;padding:0;display:grid;gap:12px;grid-template-columns:1fr;counter-reset:s}
@media (min-width:700px){.steps{grid-template-columns:repeat(3,1fr)}}
.steps li{counter-increment:s;display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:start;padding:16px;border-radius:var(--r);background:var(--surface2);min-width:0}
.steps li::before{content:counter(s);font:800 20px/1 var(--display);width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--brand);color:var(--brand-ink)}
.steps b{display:block;font-size:16px}
.steps span{display:block;color:var(--muted);font-size:14px;line-height:1.45;margin-top:2px;text-wrap:pretty}

/* Reviews */
.rev-score{display:flex;flex-wrap:wrap;align-items:center;gap:10px;color:var(--muted);font-size:14px;margin-top:10px}
.rev-score b{font:800 40px/1 var(--display);color:var(--ink)}
.rev-list{display:grid;gap:12px;grid-template-columns:1fr}
@media (min-width:700px){.rev-list{grid-template-columns:repeat(3,1fr)}}
.rev{background:var(--surface);border:var(--bw) solid var(--line);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:10px;min-width:0}
.rev p{margin:0;font-size:15px}
.rev footer{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px;color:var(--muted);margin-top:auto}
.rev .who{display:flex;align-items:center;gap:8px}
.rev .ava{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:13px;background:var(--surface2);color:var(--ink)}
.rev footer b{color:var(--ink)}

/* Location */
.where{background:var(--surface);border:var(--bw) solid var(--line);border-radius:var(--r);overflow:hidden;display:grid;grid-template-columns:1fr}
@media (min-width:760px){.where{grid-template-columns:1.1fr 1fr}.where .body{padding:32px;align-content:center}}
.map{position:relative;display:block;min-height:200px;background:var(--surface2);overflow:hidden;text-decoration:none}
.map svg{position:absolute;inset:0;width:100%;height:100%}
.map .pill{position:absolute;left:12px;bottom:12px;background:var(--surface);color:var(--ink);font-weight:700;font-size:13px;padding:6px 12px;border-radius:999px;box-shadow:var(--shadow);border:var(--bw) solid var(--line)}
.map:focus-visible{outline-offset:-4px}
.where .body{padding:20px;display:grid;gap:14px;align-content:start}
.where p{margin:0;color:var(--muted)}
.where p b{color:var(--ink)}
.where .links{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hours{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;font-size:14px;margin:0}
.hours dt{color:var(--muted)}
.hours dd{margin:0;font-weight:700;font-variant-numeric:tabular-nums;text-wrap:balance}

footer.site{padding-block:36px 24px;color:var(--muted);font-size:13px;display:grid;gap:12px;border-top:var(--bw) solid var(--line);margin-top:48px}
footer.site .row{display:flex;flex-wrap:wrap;gap:8px 18px;justify-content:space-between}
footer.site a{font-weight:700;text-decoration:none;border-bottom:1.5px solid var(--line)}
footer.site .social{display:flex;gap:14px;flex-wrap:wrap}
footer.site summary{cursor:pointer;font-weight:700}
footer.site ul{margin:8px 0 0;padding-left:18px;display:grid;gap:2px}

/* Bottom bar: quick actions when the cart is empty (phones), cart summary otherwise */
.bar{position:fixed;left:0;right:0;bottom:0;z-index:10;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(10px);
  border-top:var(--bw) solid var(--line);padding:10px 0 calc(10px + env(safe-area-inset-bottom,0px));transition:transform .25s ease}
.bar .wrap{display:grid;grid-template-columns:1fr 1fr;gap:10px;max-width:640px}
.bar .wrap.cart{grid-template-columns:1fr}
.bar.away:not(.has-cart){transform:translateY(110%);visibility:hidden}
@media (min-width:900px){.bar:not(.has-cart){display:none}}
.cartbtn{justify-content:space-between}
.cartbtn .count{background:var(--brand-ink);color:var(--brand);border-radius:999px;min-width:28px;height:28px;display:grid;place-items:center;font-size:14px;font-weight:800;padding:0 8px}

/* Sheets */
.scrim{position:fixed;inset:0;z-index:20;background:rgba(10,12,10,.55)}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;background:var(--bg);border-radius:var(--r) var(--r) 0 0;max-height:90vh;overflow:auto;overscroll-behavior:contain;
  padding:8px 0 0;box-shadow:0 -10px 40px rgba(0,0,0,.25);max-width:640px;margin-inline:auto}
.sheet .wrap{display:grid;gap:14px;max-width:640px}
.sheet > .wrap:last-child{padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
.grab{width:44px;height:5px;border-radius:9px;background:var(--line);margin:4px auto 4px}
.sheet-head{display:flex;justify-content:space-between;align-items:center;gap:12px}
.sheet-head h2{font-size:24px}
.x{width:40px;height:40px;border-radius:50%;border:var(--bw) solid var(--line);background:var(--surface);cursor:pointer;font-size:20px;line-height:1;flex:none}
.lines{display:grid;gap:8px}
.line{display:grid;grid-template-columns:52px 1fr auto;gap:12px;align-items:center;background:var(--surface);border:var(--bw) solid var(--line);border-radius:var(--r-sm);padding:6px 8px 6px 6px}
.line .ph{width:52px;border-radius:calc(var(--r-sm) - 4px)}
.line .nm{min-width:0;font-weight:700;font-size:15px;line-height:1.3}
.line .nm small{display:block;font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums}
.mode{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:var(--surface2);padding:4px;border-radius:var(--r-sm)}
.mode button{border:0;border-radius:calc(var(--r-sm) - 4px);padding:10px;font-weight:700;cursor:pointer;background:transparent}
.mode button[aria-pressed="true"]{background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button{border:var(--bw) solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;font-weight:700;font-size:14px;cursor:pointer}
.chips button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.field{display:grid;gap:4px}
.field > label,.field > .lbl{font-size:13px;font-weight:700;color:var(--muted)}
.field input,.field textarea,.field select{font:inherit;color:var(--ink);background:var(--surface);border:var(--bw) solid var(--line);border-radius:var(--r-sm);padding:12px 14px;width:100%}
.field input:focus,.field textarea:focus,.field select:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px color-mix(in srgb,var(--brand) 35%,transparent)}
.field .err{color:var(--hot);font-size:13px;font-weight:600}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.two > *{min-width:0}
.note-box{border-radius:var(--r-sm);padding:10px 14px;font-size:14px;font-weight:600;background:var(--surface2)}
.note-box.warn{background:color-mix(in srgb,var(--hot) 14%,var(--surface));color:var(--ink)}
.sum{display:grid;grid-template-columns:1fr auto;gap:4px 12px;font-variant-numeric:tabular-nums;padding-top:12px;border-top:var(--bw) dashed var(--line)}
.sum span:nth-child(odd){color:var(--muted)}
.sum span:nth-child(even){text-align:right}
.sum .t{font:800 20px var(--display);color:var(--ink);padding-top:6px}
.hint{font-size:13px;color:var(--muted);margin:0}
.send{position:sticky;bottom:0;z-index:1;display:grid;gap:4px;background:var(--bg);padding-block:10px calc(12px + env(safe-area-inset-bottom,0px));
  box-shadow:0 -14px 14px -6px var(--bg);margin-top:-4px}
.done{text-align:center;justify-items:center;padding-block:12px 4px}
.done .big-tick{width:72px;height:72px;border-radius:50%;background:var(--fill);color:var(--surface);display:grid;place-items:center}
.done .big-tick svg{width:36px;height:36px}
.done p{margin:0;color:var(--muted);max-width:40ch}
.done .btns{display:grid;gap:8px;width:100%}

/* Product sheet */
.pd .big{width:100%;border-radius:var(--hero-r);aspect-ratio:1/1;max-height:52vh;margin-inline:auto}
:root[data-design="rishton"] .pd .big{border-radius:999px 999px var(--r) var(--r)}
.pd h2{font-size:28px}
.pd p{margin:0;color:var(--muted)}
.pd .buyrow{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:center}
.pd .stepper{display:flex;align-items:center;gap:4px;background:var(--surface);border:var(--bw) solid var(--line);border-radius:999px;padding:4px}
.pd .stepper button{width:38px;height:38px;border-radius:50%;border:0;background:var(--surface2);cursor:pointer;font-size:22px;font-weight:700}
.pd .stepper span{min-width:26px;text-align:center;font-weight:800;font-size:18px;font-variant-numeric:tabular-nums}
#pd-add{font-size:15px;padding-inline:12px}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:30;
  background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:700;font-size:14px;white-space:nowrap}

/* ---------- Olov touches ---------- */
:root[data-design="olov"] .btn,:root[data-design="olov"] .fact,:root[data-design="olov"] .rev,:root[data-design="olov"] .where,
:root[data-design="olov"] .cats button,:root[data-design="olov"] .status,:root[data-design="olov"] .card,:root[data-design="olov"] .hit,
:root[data-design="olov"] .chips button{border:var(--bw) solid var(--line)}
:root[data-design="olov"] .btn.primary{box-shadow:4px 4px 0 var(--accent)}
:root[data-design="olov"] .btn.accent,:root[data-design="olov"] .btn.ghost{box-shadow:4px 4px 0 var(--line)}
:root[data-design="olov"] .btn.link{border:0;box-shadow:none}
:root[data-design="olov"] h1,:root[data-design="olov"] h2{text-transform:uppercase}
:root[data-design="olov"] .hero-photo .frame{border:var(--bw) solid var(--line);transform:rotate(-1.5deg)}
:root[data-design="olov"] .card .ph,:root[data-design="olov"] .line .ph{border:var(--bw) solid var(--line)}
:root[data-design="olov"] .hit .ph{border-bottom:var(--bw) solid var(--line)}
:root[data-design="olov"] .combo{border:var(--bw) solid var(--line);box-shadow:6px 6px 0 var(--accent)}
:root[data-design="olov"] .combo .stack .ph{border-radius:var(--ph-r);border-color:var(--combo-ink);transform:rotate(-4deg)}
:root[data-design="olov"] .combo .stack .ph:nth-child(2){transform:rotate(3deg)}
:root[data-design="olov"] .steps li{border:var(--bw) solid var(--line);background:var(--surface)}
:root[data-design="olov"] .sticker{border-radius:4px;width:auto;height:auto;padding:10px 12px;transform:rotate(-6deg);border:var(--bw) solid var(--line);font-size:13px;letter-spacing:0}
:root[data-design="olov"] .tag{border-radius:3px}
:root[data-design="olov"] .tag.new{background:var(--ink);color:var(--bg)}
:root[data-design="olov"] .rev-score b{font-size:28px;background:var(--ink);color:var(--bg);padding:6px 10px 4px;border-radius:var(--r-sm);transform:rotate(-2deg)}
:root[data-design="olov"] .mode{background:var(--surface);border:var(--bw) solid var(--line)}
:root[data-design="olov"] .mode button[aria-pressed="true"]{background:var(--ink);color:var(--bg);box-shadow:none}
:root[data-design="olov"] .pd .big{border:var(--bw) solid var(--line);box-shadow:var(--shadow);width:calc(100% - 5px)}
@media (max-width:420px){
  :root[data-design="olov"] .facts{grid-template-columns:1fr;gap:0;background:var(--surface);border:var(--bw) solid var(--line);border-radius:var(--r-sm);box-shadow:var(--shadow)}
  :root[data-design="olov"] .fact{display:flex;justify-content:space-between;align-items:baseline;gap:12px;border:0;border-top:var(--bw) dashed var(--line);border-radius:0;padding:10px 14px}
  :root[data-design="olov"] .fact:first-child{border-top:0}
  :root[data-design="olov"] .fact b{margin:0}
}

/* ---------- Rishton touches ---------- */
:root[data-design="rishton"] .hero-photo{padding:14px}
:root[data-design="rishton"] .hero-photo::before{content:"";position:absolute;inset:0;border-radius:999px 999px 42px 42px;
  background:radial-gradient(circle,var(--surface) 0 1.6px,transparent 2.2px) 0 0/12px 12px,var(--brand)}
:root[data-design="rishton"] .hero-photo .frame{aspect-ratio:1/1;box-shadow:0 0 0 5px var(--surface),0 0 0 7px var(--accent)}
@media (min-width:760px){:root[data-design="rishton"] .hero-photo .frame{aspect-ratio:6/7}}
:root[data-design="rishton"] .sticker{right:22px;top:auto;bottom:18%;border-radius:999px;width:auto;height:auto;padding:8px 14px;transform:none;animation:none;background:var(--surface);color:var(--brand);font-size:14px;letter-spacing:0;display:block}
:root[data-design="rishton"] .sticker small{display:inline;margin:0 0 0 4px}
:root[data-design="rishton"] h1 span{color:var(--brand)}
:root[data-design="rishton"] h2{line-height:1.12}
:root[data-design="rishton"] .demo{background:var(--brand);color:var(--brand-ink)}
:root[data-design="rishton"] .demo .seg button{color:var(--brand-ink)}
:root[data-design="rishton"] .demo .seg button[aria-pressed="true"]{background:var(--brand-ink);color:var(--brand)}
:root[data-design="rishton"] .combo{background:var(--combo) repeating-conic-gradient(from 45deg at 100% 0%,transparent 0 9deg,rgba(255,255,255,.07) 9deg 18deg)}
:root[data-design="rishton"] .menu-sec .sec-head{border-top:6px double var(--line);padding-top:16px}
:root[data-design="rishton"] #menu > .menu-sec:first-child .sec-head{border-top:0;padding-top:0}
:root[data-design="rishton"] .card .ph{border-radius:56px 56px 12px 12px}
:root[data-design="rishton"] .hit{padding:10px 10px 0}
:root[data-design="rishton"] .hit .ph{border-radius:var(--ph-r)}
:root[data-design="rishton"] .hit .body{padding:12px 4px 14px}
:root[data-design="rishton"] .ph .tag{top:auto;bottom:10px;left:50%;transform:translateX(-50%);box-shadow:0 2px 6px rgba(0,0,0,.25)}
:root[data-design="rishton"] .steps li::before{font:700 19px/1 var(--body)}

/* Illustration fills (fallback drawings and the map) */
.c-bg{fill:var(--surface2)} .c-brand{fill:var(--brand)} .c-acc{fill:var(--accent)} .c-hot{fill:var(--hot)}
.c-fill{fill:var(--fill)} .c-surf{fill:var(--surface)}
.c-bread{fill:#E4B46A} .c-bread2{fill:#C98B3D} .c-meat{fill:#7A3B22}

@media (prefers-reduced-motion:no-preference){
  .btn,.qty button,.stepper button{transition:transform .12s}
  .btn:active,.qty button:active,.stepper button:active{transform:scale(.96)}
  .card:hover .ph img,.hit:hover .ph img{transform:scale(1.05)}
  .sheet:not([hidden]){animation:up .24s cubic-bezier(.2,.8,.2,1)}
  @keyframes up{from{transform:translateY(40px);opacity:.5}to{transform:none;opacity:1}}
  .sticker{animation:wob 6s ease-in-out infinite}
  @keyframes wob{50%{rotate:-6deg}}
}
</style>
</head>
<body>

<div id="page">
<div class="demo" id="demo">
  <div class="wrap">
    <b data-i18n="design">Dizayn</b>
    <div class="seg" id="designs">
      <button type="button" id="d-yashil" data-design="yashil" aria-pressed="true"><i class="dot" style="background:#1F5A3E"></i>Yashil</button>
      <button type="button" id="d-olov" data-design="olov" aria-pressed="false"><i class="dot" style="background:#F6CF3E"></i>Olov</button>
      <button type="button" id="d-rishton" data-design="rishton" aria-pressed="false"><i class="dot" style="background:#1B3F96"></i>Rishton</button>
    </div>
    <span class="demo-note" data-i18n="demoNote"></span>
    <span class="spacer"></span>
    <div class="seg" id="langs">
      <button type="button" id="l-uz" data-lang="uz" aria-pressed="true">UZ</button>
      <button type="button" id="l-ru" data-lang="ru" aria-pressed="false">RU</button>
    </div>
  </div>
</div>

<div class="promo" id="promo" hidden><div class="wrap" id="promo-text"></div></div>

<div class="wrap">
  <div class="top">
    <a class="logo" href="#"><i id="logo-mark">DL</i><span id="logo-name">Doda Lavash</span></a>
    <span class="status" id="status"><i></i><span id="status-text"></span></span>
  </div>

  <header class="hero">
    <div class="hero-text">
      <p class="eyebrow" id="eyebrow"></p>
      <h1 id="h1"></h1>
      <p class="lead" id="tagline"></p>
      <a class="rating" id="rating" target="_blank" rel="noopener">
        <span class="stars" id="stars"></span><b id="rating-num"></b><span id="rating-count"></span>
      </a>
    </div>
    <figure class="hero-photo" id="hero-photo">
      <div class="sticker" id="sticker"></div>
      <div class="frame"><img id="hero-img" alt="" fetchpriority="high"></div>
    </figure>
    <div class="hero-act" id="hero-act">
      <div class="actions">
        <a class="btn primary" id="call">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.7a2 2 0 0 1-.5 2.1L8 9.8a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.7.7a2 2 0 0 1 1.7 2z"/></svg>
          <span data-i18n="call"></span>
        </a>
        <a class="btn accent" id="tg" target="_blank" rel="noopener">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M21.9 4.3 18.8 19c-.2 1-.8 1.3-1.7.8l-4.6-3.4-2.2 2.1c-.2.2-.5.5-1 .5l.3-4.7 8.6-7.8c.4-.3-.1-.5-.6-.2L6.9 13l-4.6-1.4c-1-.3-1-1 .2-1.5L20.5 3c.8-.3 1.6.2 1.4 1.3z"/></svg>
          Telegram
        </a>
        <a class="btn ghost route" id="route" target="_blank" rel="noopener">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s-7-6.2-7-12a7 7 0 0 1 14 0c0 5.8-7 12-7 12z"/><circle cx="12" cy="10" r="2.5"/></svg>
          <span data-i18n="route"></span>
        </a>
      </div>
      <p class="phone"><span data-i18n="phoneLbl"></span>: <b id="phone-text"></b></p>
    </div>
  </header>

  <div class="facts">
    <div class="fact"><small data-i18n="hoursLbl"></small><b id="f-hours"></b></div>
    <div class="fact"><small data-i18n="deliveryTime"></small><b id="f-time"></b></div>
    <div class="fact"><small data-i18n="avg"></small><b id="f-avg"></b></div>
  </div>
</div>

<section class="sec" id="hits-sec" aria-labelledby="hits-h">
  <div class="wrap sec-head"><div><p class="eyebrow" data-i18n="hitsEyebrow"></p><h2 id="hits-h" data-i18n="hits"></h2></div></div>
  <div class="rail" id="rail"></div>
</section>

<div class="wrap sec" id="combo-wrap"></div>

<nav class="cats" id="cats-nav">
  <div class="wrap" id="cats"></div>
</nav>

<main class="wrap">
  <div id="menu"></div>

  <section class="sec" aria-labelledby="how-h">
    <div class="sec-head"><div><p class="eyebrow" data-i18n="howEyebrow"></p><h2 id="how-h" data-i18n="how"></h2></div></div>
    <ol class="steps" id="steps"></ol>
  </section>

  <section class="sec" aria-labelledby="rev-h">
    <div class="sec-head">
      <div>
        <p class="eyebrow" data-i18n="revEyebrow"></p>
        <h2 id="rev-h" data-i18n="reviews"></h2>
        <div class="rev-score"><b id="rev-num"></b><span class="stars" id="rev-stars"></span><span id="rev-count"></span></div>
      </div>
      <a class="btn ghost small" id="review-btn" target="_blank" rel="noopener" data-i18n="leaveReview"></a>
    </div>
    <div class="rev-list" id="rev-list"></div>
  </section>

  <section class="sec" aria-labelledby="where-h">
    <div class="where">
      <a class="map" id="map-link" target="_blank" rel="noopener">
        <svg viewBox="0 0 400 260" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
          <rect width="400" height="260" class="c-bg"/>
          <path d="M-10 160 L410 120" style="stroke:var(--surface);stroke-width:24;fill:none"/>
          <path d="M150 -10 L196 270" style="stroke:var(--surface);stroke-width:14;fill:none"/>
          <path d="M310 -10 L284 270" style="stroke:var(--surface);stroke-width:10;fill:none"/>
          <path d="M-10 48 L160 36" style="stroke:var(--surface);stroke-width:8;fill:none"/>
          <rect x="36" y="64" width="78" height="52" rx="6" style="fill:var(--line)"/>
          <rect x="212" y="24" width="60" height="70" rx="6" style="fill:var(--line)"/>
          <rect x="318" y="158" width="66" height="70" rx="6" style="fill:var(--line)"/>
          <rect x="26" y="184" width="104" height="56" rx="6" style="fill:var(--line)"/>
          <rect x="208" y="160" width="62" height="44" rx="6" class="c-fill" opacity=".45"/>
          <circle cx="240" cy="132" r="28" class="c-brand" opacity=".18"/>
          <path d="M240 136c-10-12-16-20-16-28a16 16 0 0 1 32 0c0 8-6 16-16 28z" class="c-hot"/>
          <circle cx="240" cy="108" r="6" class="c-surf"/>
        </svg>
        <span class="pill" data-i18n="openMap"></span>
      </a>
      <div class="body">
        <h2 id="where-h" data-i18n="findUs"></h2>
        <p id="addr"></p>
        <p><b data-i18n="landmarkLbl"></b>: <span id="landmark"></span></p>
        <dl class="hours" id="hours"></dl>
        <div class="links">
          <a class="btn primary small" id="gmaps" target="_blank" rel="noopener">Google Maps</a>
          <a class="btn ghost small" id="ymaps" target="_blank" rel="noopener">Yandex Maps</a>
        </div>
      </div>
    </div>
  </section>

  <footer class="site">
    <div class="row">

    (del ? "<span>" + esc(t("dfee")) + "</span><span>" + (tt.fee ? money(tt.fee) : esc(t("free"))) + "</span>" : "") +
    '<span class="t">' + esc(t("total")) + '</span><span class="t">' + money(tt.total) + "</span>";
  $("upsell").hidden = !(tt.toFree > 0 && !tt.short);
  $("upsell").textContent = t("upsell", { n: money(tt.toFree) });
  $("min-err").hidden = !tt.short;
  $("min-err").textContent = t("minErr", { n: money(tt.zone.min), k: money(tt.short) });
  var os = openState();
  $("closed-note").hidden = os.open;
  $("closed-note").textContent = os.open ? "" : t("closedNote", { t: os.from });
  $("send").disabled = !!tt.short;
  $("send-label").textContent = t("send", { n: money(tt.total) });
}

function renderPd() {
  var it = ITEMS[state.pd]; if (!it) return;
  var cat = CAT_OF[it.id];
  $("pd-cat").textContent = cat ? L(cat.title) : t("comboEyebrow");
  $("pd-ph").outerHTML = photoHtml(it, { static: true, tag: true, cls: "big", id: "pd-ph" });
  $("pd-h").textContent = L(it.name);
  $("pd-desc").textContent = L(it.desc) + (it.weight ? " · " + it.weight : "");
  $("pd-n").textContent = state.pdN;
  var on = isOn(it.id);
  $("pd-add").disabled = !on; $("pd-minus").disabled = !on; $("pd-plus").disabled = !on;
  $("pd-add").textContent = on ? t("addToCart", { n: money(it.price * state.pdN) }) : t("soldOut");
}

function refreshQty(id) {
  document.querySelectorAll('.qty[data-id="' + id + '"]').forEach(function (el) { el.outerHTML = qtyHtml(id); });
  renderBar();
  if (!$("sheet").hidden && !$("order").hidden) { if (Object.keys(state.cart).length) renderSheet(); else closeSheets(); }
}

function renderAll() {
  renderStatic(); renderHits(); renderCombo(); renderCats(); renderMenu(); renderBar();
  if (!$("sheet").hidden && !$("order").hidden) renderSheet();
  if (!$("pd").hidden) renderPd();
}

/* ================= Buyurtma matni ================= */
function orderNo() {
  if (!state.orderNo) state.orderNo = (Date.now() % 1679616).toString(36).toUpperCase();
  while (state.orderNo.length < 4) state.orderNo = "0" + state.orderNo;
  return state.orderNo;
}
function orderText() {
  var tt = cartTotals(), del = state.mode === "delivery", os = openState();
  var lines = ["🧾 №" + orderNo() + " · " + t("orderTitle") + " — " + CONFIG.name];
  if (!os.open) lines.unshift("⏰ " + t("preorder"));
  lines.push("");
  Object.keys(state.cart).forEach(function (id) { lines.push(state.cart[id] + " × " + L(ITEMS[id].name) + " — " + money(ITEMS[id].price * state.cart[id])); });
  lines.push("");
  if (del) lines.push(t("dfee") + (ZONES.length > 1 ? " (" + L(tt.zone.name) + ")" : "") + ": " + (tt.fee ? money(tt.fee) : t("free")));
  lines.push(t("total") + ": " + money(tt.total));
  if (state.pay) lines.push(t("payInfo") + ": " + t("pay_" + state.pay) + (state.pay === "cash" && $("o-change").value.trim() ? " · " + t("changeMsg") + " " + $("o-change").value.trim() : ""));
  lines.push("");
  var name = $("o-name").value.trim(), phone = $("o-phone").value.trim(), addr = $("o-addr").value.trim(), mark = $("o-mark").value.trim(), note = $("o-note").value.trim();
  if (name) lines.push(t("nameMsg") + ": " + name);
  lines.push(t("phoneLbl") + ": " + phone);
  if (del) { lines.push(t("addrLbl") + ": " + (addr || "—")); if (mark) lines.push(t("landmarkLbl") + ": " + mark); }
  else lines.push(t("pickupMsg"));
  if (note) lines.push(t("noteMsg") + ": " + note);
  return lines.join("\n").replace(/ |⁠/g, function (c) { return c === NB ? " " : ""; });
}
function tgLink(txt) { return "https://t.me/" + CONFIG.telegram + "?text=" + encodeURIComponent(txt); }

var toastTimer;
function toast(msg) { var el = $("toast"); el.textContent = msg; el.hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(function () { el.hidden = true; }, 1800); }

/* ================= Oynalar ================= */
var opener = null, openerSel = null;
function openSheet(id) {
  var from = document.activeElement;
  closeSheets(true);
  opener = from;
  openerSel = from && from.id ? "#" + from.id : from && from.dataset && from.dataset.open ? '[data-open="' + from.dataset.open + '"]:not([tabindex])' : null;
  if (id === "sheet") { $("order").hidden = false; $("done").hidden = true; renderSheet(); } else renderPd();
  $(id).hidden = false; $("scrim").hidden = false;
  $("page").inert = true; document.body.style.overflow = "hidden";
  $(id).querySelector("[data-close]").focus();
}
function closeSheets(keepFocus) {
  var wasOpen = !$("scrim").hidden;
  $("sheet").hidden = true; $("pd").hidden = true; $("scrim").hidden = true;
  $("page").inert = false; document.body.style.overflow = "";
  if (keepFocus || !wasOpen) return;
  var back = (opener && document.contains(opener) && opener.offsetParent) ? opener : (openerSel && document.querySelector(openerSel)) || $("open-cart") || document.querySelector(".bar .btn");
  if (back) back.focus({ preventScroll: true });
}

/* ================= Hodisalar ================= */
document.addEventListener("click", function (e) {
  var b = e.target.closest("button"); if (!b || b.disabled) return;
  if (b.closest("#designs")) { state.design = b.dataset.design; persist(); renderStatic(); return; }
  if (b.closest("#langs")) { state.lang = b.dataset.lang; persist(); renderAll(); return; }
  if (b.closest("#cats")) {
    state.cat = b.dataset.cat; renderCats();
    document.querySelectorAll("section.menu-sec").forEach(function (s) { s.hidden = state.cat !== "all" && s.dataset.cat !== state.cat; });
    var m = $("menu");
    if (state.cat !== "all" || m.getBoundingClientRect().top < 0)
      m.scrollIntoView({ block: "start", behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth" });
    $("cat-" + state.cat).focus({ preventScroll: true });
    return;
  }
  if (b.closest("#mode")) { state.mode = b.dataset.mode; renderSheet(); return; }
  if (b.closest("#pay")) { state.pay = b.dataset.pay; renderSheet(); $("pay").querySelector('[data-pay="' + state.pay + '"]').focus(); return; }
  if (b.hasAttribute("data-open")) { state.pd = b.getAttribute("data-open"); state.pdN = 1; openSheet("pd"); return; }
  if (b.hasAttribute("data-close")) { closeSheets(); return; }
  var q = b.closest(".qty");
  if (q) {
    var id = q.dataset.id, isPlus = b.classList.contains("plus"), n = (state.cart[id] || 0) + (isPlus ? 1 : -1);
    var all = document.querySelectorAll('.qty[data-id="' + id + '"]'), idx = Array.prototype.indexOf.call(all, q), inSheet = !!q.closest("#lines");
    if (n > 0) state.cart[id] = n; else delete state.cart[id];
    state.orderNo = null;
    persist(); refreshQty(id);
    announce(t("inCart", { name: L(ITEMS[id].name), n: n > 0 ? n : 0 }));
    // fokus o'sha joyda qolsin, sahifa sakramasin
    var same = inSheet ? $("lines").querySelector('.qty[data-id="' + id + '"]') : document.querySelectorAll('.qty[data-id="' + id + '"]')[idx];
    var target = same && same.querySelector(n > 0 && !isPlus ? ".minus" : ".plus");
    if (target) target.focus({ preventScroll: true });
    else if (!$("sheet").hidden) { var nx = $("lines").querySelector(".qty .plus"); (nx || $("sheet").querySelector("[data-close]")).focus(); }
    return;
  }
  if (b.id === "pd-minus" || b.id === "pd-plus") { state.pdN = Math.min(99, Math.max(1, state.pdN + (b.id === "pd-plus" ? 1 : -1))); renderPd(); announce(String(state.pdN)); return; }
  if (b.id === "pd-add") {
    var pid = state.pd;
    state.cart[pid] = Math.min(99, (state.cart[pid] || 0) + state.pdN); state.orderNo = null; persist();
    closeSheets(); refreshQty(pid); toast(t("added")); return;
  }
  if (b.id === "open-cart") { openSheet("sheet"); return; }
  if (b.id === "new-order") {
    state.cart = {}; state.orderNo = null; persist();
    ["o-note", "o-change"].forEach(function (f) { $(f).value = ""; });
    closeSheets(true); renderAll(); var first = document.querySelector("#rail .plus, #menu .plus"); if (first) first.focus({ preventScroll: true }); return;
  }
  if (b.id === "copy-btn") {
    var txt = orderText();
    var done = function () { toast(t("copied")); };
    try { navigator.clipboard.writeText(txt).then(done, function () { fallbackCopy(txt); done(); }); } catch (err) { fallbackCopy(txt); done(); }
  }
});
function fallbackCopy(txt) { var ta = document.createElement("textarea"); ta.value = txt; document.body.appendChild(ta); ta.select(); try { document.execCommand("copy"); } catch (e) {} ta.remove(); }
$("scrim").addEventListener("click", function () { closeSheets(); });
document.addEventListener("keydown", function (e) { if (e.key === "Escape" && !$("scrim").hidden) closeSheets(); });
$("o-phone").addEventListener("input", function () { $("phone-err").hidden = true; $("o-phone").removeAttribute("aria-invalid"); });
$("o-zone").addEventListener("change", function () { state.zone = $("o-zone").value; renderSheet(); });
$("order").addEventListener("submit", function (e) {
  e.preventDefault();
  if (cartTotals().short) return;
  var digits = $("o-phone").value.replace(/\D/g, "");
  if (digits.length < 9) { $("phone-err").hidden = false; $("o-phone").setAttribute("aria-invalid", "true"); $("o-phone").focus(); return; }
  var txt = orderText(), link = tgLink(txt);
  try { navigator.clipboard.writeText(txt).catch(function () {}); } catch (err) {}
  var a = document.createElement("a"); a.href = link; a.target = "_blank"; a.rel = "noopener"; document.body.appendChild(a); a.click(); a.remove();
  // Natija: xabar yuborildi deb aytmaymiz — faqat Telegram ochilganini va keyingi qadamni ko'rsatamiz
  $("order").hidden = true; $("done").hidden = false;
  $("done-h").textContent = t("doneH", { no: orderNo() });
  $("done-p").textContent = t("doneP");
  $("done-tg").href = link; $("done-tg").textContent = t("doneTg");
  $("done-call").href = "tel:" + CONFIG.phone; $("done-call").textContent = t("doneCall", { p: CONFIG.phoneText });
  $("done").querySelector("[data-close]").focus();
});

/* Pastki panel: hero tugmalari ko'rinib turganda takrorlanmasin */
if ("IntersectionObserver" in window) {
  new IntersectionObserver(function (en) { $("bar-box").classList.toggle("away", en[0].isIntersecting); }).observe($("hero-act"));
}

/* ================= Narxlarni Google Sheets'dan olish (ixtiyoriy) ================= */
function loadPrices() {
  if (!CONFIG.pricesCsv || !window.fetch) return;
  var ctl = window.AbortController ? new AbortController() : null;
  var timer = setTimeout(function () { if (ctl) ctl.abort(); }, 3000);
  fetch(CONFIG.pricesCsv, ctl ? { signal: ctl.signal } : {}).then(function (r) { return r.ok ? r.text() : ""; }).then(function (csv) {
    clearTimeout(timer);
    var rows = csv.split(/\r?\n/).map(function (l) { return l.split(",").map(function (c) { return c.trim().replace(/^"|"$/g, ""); }); });
    var head = (rows.shift() || []).map(function (h) { return h.toLowerCase(); });
    var iId = head.indexOf("id"), iPrice = head.indexOf("price"), iAv = head.indexOf("available");
    if (iId < 0) return;
    rows.forEach(function (r) {
      var it = ITEMS[r[iId]]; if (!it || it.combo) return;
      var p = parseInt((r[iPrice] || "").replace(/\D/g, ""), 10); if (p > 0) it.price = p;
      if (iAv > -1 && r[iAv] !== "") it.available = !/^(0|no|false|yo'q|нет)$/i.test(r[iAv]);
    });
    if (CONFIG.combo) { CONFIG.combo.full = CONFIG.combo.items.reduce(function (s, id) { return s + ITEMS[id].price; }, 0); ITEMS[CONFIG.combo.id].available = CONFIG.combo.items.every(isOn); }
    Object.keys(state.cart).forEach(function (id) { if (!isOn(id)) delete state.cart[id]; });
    renderAll();
  }).catch(function () { clearTimeout(timer); });
}

renderAll();
loadPrices();
setInterval(renderStatus, 60000);

/* ================= Google uchun ma'lumot (Schema.org) ================= */
try {
  var uz = function (o) { return typeof o === "string" ? o : (o && o.uz) || ""; };
  var ld = { "@context": "https://schema.org", "@type": CONFIG.type || "Restaurant", name: CONFIG.name, telephone: CONFIG.phone,
    address: { "@type": "PostalAddress", streetAddress: uz(CONFIG.text.uz && CONFIG.text.uz.address), addressLocality: CONFIG.city || "", addressRegion: CONFIG.region || "", addressCountry: "UZ" },
    hasMap: CONFIG.googleMaps, servesCuisine: "Fast food", priceRange: CONFIG.avgCheck + " 000 UZS",
    openingHours: CONFIG.hours.always ? "Mo-Su 00:00-23:59" : "Mo-Su " + CONFIG.hours.from + "-" + CONFIG.hours.to,
    hasMenu: { "@type": "Menu", hasMenuSection: CONFIG.menu.map(function (c) {
      return { "@type": "MenuSection", name: uz(c.title), hasMenuItem: c.items.map(function (it) {
        return { "@type": "MenuItem", name: uz(it.name), description: uz(it.desc), offers: { "@type": "Offer", price: it.price, priceCurrency: "UZS" } }; }) }; }) } };
  if (CONFIG.coords) ld.geo = { "@type": "GeoCoordinates", latitude: CONFIG.coords[0], longitude: CONFIG.coords[1] };
  if (CONFIG.rating && CONFIG.reviewsCount) ld.aggregateRating = { "@type": "AggregateRating", ratingValue: CONFIG.rating, reviewCount: CONFIG.reviewsCount };
  var s = document.createElement("script"); s.type = "application/ld+json"; s.textContent = JSON.stringify(ld); document.head.appendChild(s);
} catch (e) { console.warn("schema.org:", e); }
</script>
