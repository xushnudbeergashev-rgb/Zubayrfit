<!doctype html>
<html lang="uz" data-design="yashil">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Doda Lavash</title>
<meta name="description" content="Doda Lavash — Chinobod, Andijon. Kechayu kunduz ochiq. Lavash, burger va ichimliklar. Telegram orqali buyurtma.">
<meta property="og:type" content="website">
<meta property="og:title" content="Doda Lavash — Chinobod, 24/7">
<meta property="og:description" content="Issiq lavash, burger va sovuq ichimliklar. Menyu va Telegram orqali buyurtma.">
<meta property="og:image" content="og.jpg">
<meta name="theme-color" content="#1F5A3E">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%231F5A3E'/%3E%3Ctext x='32' y='43' font-family='Arial' font-weight='900' font-size='30' text-anchor='middle' fill='%23fff'%3EDL%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Golos+Text:wght@400;600;700&family=Manrope:wght@400;600;800&family=Prata&family=Unbounded:wght@600;800&display=swap">
<style>
/* Layout: mobile-first, photo-led. Demo switcher → top bar → hero (text, photo, actions) → facts → "most ordered" photo rail → combo banner → sticky category chips → menu photo cards → how-to-order steps → reviews → location → footer with photo credits. Cart bar fixed at bottom; product and order sheets slide up.
   Three designs share one structure: yashil (fresh market), olov (street-food poster), rishton (cobalt ceramics, arch-shaped photos). */
:root{
  --bg:#F7F8F3; --surface:#FFFFFF; --surface2:#EEF2E8; --ink:#16241B; --muted:#5A6A5F; --line:#DCE3D6;
  --brand:#1F5A3E; --brand-ink:#FFFFFF; --accent:#F2B21B; --accent-ink:#1A1A12; --hot:#C8402A; --fill:#3E9B5A;
  --display:"Unbounded","Arial Black",system-ui,sans-serif; --body:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:20px; --r-sm:12px; --ph-r:16px; --hero-r:28px; --h1:clamp(40px,11vw,74px); --h1-track:-.035em; --bw:1.5px;
  --shadow:0 1px 2px rgba(22,36,27,.06),0 8px 24px -12px rgba(22,36,27,.18);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1712; --surface:#17221B; --surface2:#1E2C23; --ink:#ECF2EC; --muted:#9FB0A4; --line:#2A3A2F;
  --brand:#4FA078; --brand-ink:#06110B; --accent:#F6C445; --accent-ink:#1A1A12; --hot:#EC6A52; --fill:#6CC07B;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px -12px rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1712; --surface:#17221B; --surface2:#1E2C23; --ink:#ECF2EC; --muted:#9FB0A4; --line:#2A3A2F;
  --brand:#4FA078; --brand-ink:#06110B; --accent:#F6C445; --accent-ink:#1A1A12; --hot:#EC6A52; --fill:#6CC07B;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px -12px rgba(0,0,0,.6); color-scheme:dark}

/* Olov — street-food poster: mustard paper, black ink, tomato red */
:root[data-design="olov"]{
  --bg:#F6CF3E; --surface:#FFF6D6; --surface2:#F1C21F; --ink:#141210; --muted:#4A3F25; --line:#141210;
  --brand:#141210; --brand-ink:#F6CF3E; --accent:#E2381F; --accent-ink:#FFF6D6; --hot:#C42A14; --fill:#2E8B3E;
  --display:"Dela Gothic One","Arial Black",system-ui,sans-serif; --body:"Golos Text",system-ui,-apple-system,sans-serif;
  --r:6px; --r-sm:4px; --ph-r:4px; --hero-r:6px; --h1:clamp(44px,13vw,88px); --h1-track:-.01em; --bw:2.5px;
  --shadow:5px 5px 0 #141210}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"])[data-design="olov"]{
  --bg:#17140D; --surface:#221D12; --surface2:#2C2615; --ink:#F7E7B0; --muted:#C2B07A; --line:#F6CF3E;
  --brand:#F6CF3E; --brand-ink:#17140D; --accent:#F0573D; --accent-ink:#17140D; --hot:#FF7158; --fill:#6CC07B;
  --shadow:5px 5px 0 #F6CF3E}}
:root[data-theme="dark"][data-design="olov"]{
  --bg:#17140D; --surface:#221D12; --surface2:#2C2615; --ink:#F7E7B0; --muted:#C2B07A; --line:#F6CF3E;
  --brand:#F6CF3E; --brand-ink:#17140D; --accent:#F0573D; --accent-ink:#17140D; --hot:#FF7158; --fill:#6CC07B;
  --shadow:5px 5px 0 #F6CF3E}

/* Rishton — cobalt glaze, white clay, turquoise; photos sit in arches like an iwan */
:root[data-design="rishton"]{
  --bg:#F3F6FB; --surface:#FFFFFF; --surface2:#E3EBF7; --ink:#0F1E3D; --muted:#4F5F7E; --line:#D2DCEC;
  --brand:#1B3F96; --brand-ink:#FFFFFF; --accent:#1FA5A0; --accent-ink:#FFFFFF; --hot:#C2473B; --fill:#1FA5A0;
  --display:"Prata",Georgia,"Times New Roman",serif; --body:"Golos Text",system-ui,-apple-system,sans-serif;
  --r:22px; --r-sm:14px; --ph-r:999px 999px 14px 14px; --hero-r:999px 999px 28px 28px; --h1:clamp(44px,12vw,82px); --h1-track:0;
  --shadow:0 1px 2px rgba(15,30,61,.06),0 10px 30px -14px rgba(27,63,150,.35)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"])[data-design="rishton"]{
  --bg:#0B1226; --surface:#121C36; --surface2:#182647; --ink:#E7EDFA; --muted:#9CABCB; --line:#24345C;
  --brand:#7EA2F2; --brand-ink:#0B1226; --accent:#42C7C1; --accent-ink:#0B1226; --hot:#F07A6C; --fill:#42C7C1;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px -14px rgba(0,0,0,.7)}}
:root[data-theme="dark"][data-design="rishton"]{
  --bg:#0B1226; --surface:#121C36; --surface2:#182647; --ink:#E7EDFA; --muted:#9CABCB; --line:#24345C;
  --brand:#7EA2F2; --brand-ink:#0B1226; --accent:#42C7C1; --accent-ink:#0B1226; --hot:#F07A6C; --fill:#42C7C1;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px -14px rgba(0,0,0,.7)}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-padding-top:72px}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 var(--body);
  padding-bottom:calc(96px + env(safe-area-inset-bottom,0px));transition:background-color .25s,color .25s}
.wrap{max-width:1040px;margin:0 auto;padding-inline:16px}
a{color:inherit}
button{font:inherit;color:inherit}
img{max-width:100%}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}
svg{display:block}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0}
h2{font:800 clamp(26px,6.4vw,38px)/1.05 var(--display);margin:0;text-wrap:balance;letter-spacing:var(--h1-track)}
.sec{margin-top:48px}
.sec-head{display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:10px 16px;margin-bottom:16px}
.sec-head > div{display:grid;gap:6px;min-width:0}

/* Demo strip — only for showing the owner */
.demo{background:var(--ink);color:var(--bg);font-size:13px}
.demo .wrap{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;padding-block:8px}
.demo b{font-weight:700;letter-spacing:.06em;text-transform:uppercase;font-size:11px;opacity:.7}
.seg{display:flex;gap:4px;flex-wrap:wrap}
.seg button{border:1px solid color-mix(in srgb,var(--bg) 35%,transparent);background:transparent;color:var(--bg);
  border-radius:999px;padding:3px 10px;font-size:13px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:6px}
.seg button[aria-pressed="true"]{background:var(--bg);color:var(--ink)}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;border:1px solid color-mix(in srgb,var(--bg) 40%,transparent)}
.demo .spacer{flex:1}

/* Top bar */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:16px 0}
.logo{display:flex;align-items:center;gap:10px;font:800 15px var(--display);text-decoration:none}
.logo i{width:40px;height:40px;border-radius:var(--r-sm);background:var(--brand);color:var(--brand-ink);display:grid;place-items:center;font-style:normal;font-size:14px}
.status{display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:700;border-radius:999px;padding:6px 12px;
  background:var(--surface);border:var(--bw) solid var(--line)}
.status i{width:8px;height:8px;border-radius:50%;background:var(--fill);box-shadow:0 0 0 4px color-mix(in srgb,var(--fill) 25%,transparent)}
.status.closed i{background:var(--hot);box-shadow:0 0 0 4px color-mix(in srgb,var(--hot) 25%,transparent)}

/* Hero */
.hero{display:grid;gap:18px;padding-block:22px 4px;grid-template-areas:"text" "photo" "act"}
.hero-text{grid-area:text;min-width:0}
.hero-act{grid-area:act;min-width:0}
.hero-photo{grid-area:photo;margin:0;position:relative;min-width:0}
h1{font:800 var(--h1)/.92 var(--display);letter-spacing:var(--h1-track);margin:10px 0 14px;text-wrap:balance}
h1 span{color:var(--hot)}
.lead{font-size:18px;color:var(--muted);margin:0;max-width:36ch}
.rating{display:inline-flex;flex-wrap:wrap;align-items:center;gap:6px 8px;font-size:14px;color:var(--muted);margin-top:16px;text-decoration:none}
.rating b{color:var(--ink);font-size:16px}
.stars{display:flex;gap:2px;color:var(--accent)}
.stars svg{width:16px;height:16px}
.hero-photo .frame{position:relative;aspect-ratio:5/4;max-width:100%;border-radius:var(--hero-r);overflow:hidden;background:var(--surface2);box-shadow:var(--shadow)}
.hero-photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.sticker{position:absolute;right:-6px;top:-10px;background:var(--accent);color:var(--accent-ink);font:800 13px/1.1 var(--display);
  text-align:center;width:92px;height:92px;border-radius:50%;display:grid;place-items:center;transform:rotate(12deg);padding:8px;z-index:1;box-shadow:var(--shadow)}
.sticker small{display:block;font:700 11px var(--body)}
.credit-chip{position:absolute;left:12px;bottom:12px;font-size:11px;color:#fff;background:rgba(0,0,0,.45);padding:3px 8px;border-radius:999px;backdrop-filter:blur(4px)}
@media (min-width:760px){
  .hero{grid-template-columns:1.1fr 1fr;grid-template-areas:"text photo" "act photo";column-gap:40px;align-items:center;padding-top:36px}
  .hero-text{align-self:end}.hero-act{align-self:start}
  .hero-photo .frame{aspect-ratio:4/5}
}

.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.actions .route{grid-column:1 / -1}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:52px;border-radius:var(--r-sm);padding:0 16px;
  font-weight:700;text-decoration:none;font-size:16px;border:0;cursor:pointer;text-align:center}
.btn svg{width:20px;height:20px;flex:none}
.btn.primary{background:var(--brand);color:var(--brand-ink)}
.btn.accent{background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:var(--surface);color:var(--ink);border:var(--bw) solid var(--line)}
.btn.small{min-height:44px;font-size:15px}
.phone{margin:12px 0 0;font-size:14px;color:var(--muted)}
.phone b{color:var(--ink);font-variant-numeric:tabular-nums;user-select:all}

.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:28px}
.fact{background:var(--surface);border:var(--bw) solid var(--line);border-radius:var(--r-sm);padding:12px 14px;min-width:0}
.fact small{display:block;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.fact b{display:block;font:800 18px/1.2 var(--display);margin-top:4px;font-variant-numeric:tabular-nums}
@media (max-width:420px){.fact{padding:10px}.fact b{font-size:14px}.fact small{font-size:10px}}

/* Photo frame shared by cards */
.ph{display:block;position:relative;overflow:hidden;background:var(--surface2);border-radius:var(--ph-r);border:0;padding:0;cursor:pointer;aspect-ratio:1/1;max-width:100%}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .35s}
.ph svg{position:absolute;inset:18%;width:64%;height:64%}

/* Most-ordered rail */
.rail{display:grid;grid-auto-flow:column;grid-auto-columns:min(70%,250px);gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;
  padding:4px max(16px,calc((100% - 1008px)/2)) 14px;scrollbar-width:none}
.rail::-webkit-scrollbar{display:none}
.hit{scroll-snap-align:start;background:var(--surface);border:var(--bw) solid var(--line);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column;min-width:0;box-shadow:var(--shadow)}
.hit .ph{border-radius:0}
:root[data-design="rishton"] .hit{padding:10px 10px 0}
:root[data-design="rishton"] .hit .ph{border-radius:var(--ph-r)}
.hit .body{padding:12px 14px 14px;display:grid;gap:8px;flex:1}
.hit h3{margin:0;font-size:16px;line-height:1.3}
.hit .row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:auto}
.price{font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}
.tag{display:inline-block;font-size:10.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;
  border-radius:999px;padding:2px 8px;background:var(--hot);color:#fff;white-space:nowrap}
.tag.new{background:var(--fill)}
.ph .tag{position:absolute;left:10px;top:10px;z-index:1}
:root[data-design="olov"] .tag{border-radius:3px}

/* Combo banner */
.combo{display:grid;grid-template-columns:1fr;gap:16px;background:var(--brand);color:var(--brand-ink);border-radius:var(--r);padding:20px;position:relative;overflow:hidden}
.combo .stack{display:flex;padding-left:18px}
.combo .stack img,.combo .stack .ph{width:84px;height:84px;border-radius:50%;margin-left:-18px;border:4px solid var(--brand);object-fit:cover;background:var(--surface2);flex:none}
.combo h3{font:800 24px/1.1 var(--display);margin:4px 0 6px}
.combo p{margin:0;opacity:.85;font-size:15px}
.combo .eyebrow{color:inherit;opacity:.75}
.combo .buy{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px}
.combo .now{font:800 26px var(--display);font-variant-numeric:tabular-nums}
.combo s{opacity:.7;font-variant-numeric:tabular-nums}
.combo .save{background:var(--accent);color:var(--accent-ink);font-weight:800;font-size:13px;border-radius:999px;padding:3px 10px}
.combo .btn{background:var(--brand-ink);color:var(--brand)}
@media (min-width:700px){.combo{grid-template-columns:auto 1fr auto;align-items:center;padding:24px 28px;gap:28px}.combo .stack img,.combo .stack .ph{width:104px;height:104px}}

/* Category chips */
nav.cats{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:var(--bw) solid var(--line);margin-top:40px}
.cats .wrap{display:flex;gap:8px;overflow-x:auto;padding-block:12px;scrollbar-width:none}
.cats .wrap::-webkit-scrollbar{display:none}
.cats button{flex:none;font-weight:700;font-size:14px;padding:8px 16px;border-radius:999px;cursor:pointer;
  background:var(--surface);border:var(--bw) solid var(--line)}
.cats button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

/* Menu */
.menu-sec{padding-top:28px}
.menu-sec .sec-head{margin-bottom:14px}
.note{font-size:14px;color:var(--muted);margin:0}
.grid{display:grid;gap:12px;grid-template-columns:1fr}
@media (min-width:700px){.grid{grid-template-columns:1fr 1fr}}
.card{display:grid;grid-template-columns:112px 1fr;gap:14px;padding:10px;background:var(--surface);border:var(--bw) solid var(--line);border-radius:var(--r);min-width:0}
.card .ph{width:112px}
.card .txt{display:flex;flex-direction:column;gap:4px;min-width:0;padding-block:2px}
.card h3{margin:0;font-size:16.5px;line-height:1.3}
.card h3 button{all:unset;cursor:pointer}
.card h3 button:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:4px}
.card p{margin:0;color:var(--muted);font-size:14px;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card .row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:auto;padding-top:6px}
.card .tag{margin-left:6px;vertical-align:2px}

.qty{display:flex;align-items:center;gap:2px;background:var(--surface);border:var(--bw) solid var(--line);border-radius:999px;padding:3px;flex:none}
.qty button{width:34px;height:34px;border-radius:50%;border:0;background:transparent;cursor:pointer;font-size:20px;font-weight:700;line-height:1;display:grid;place-items:center}
.qty .plus{background:var(--brand);color:var(--brand-ink)}
.qty span{min-width:20px;text-align:center;font-weight:800;font-variant-numeric:tabular-nums}
.qty:not(.has) .minus,.qty:not(.has) span{display:none}
.qty:not(.has){border-color:transparent;background:transparent}
.combo .qty .plus{background:var(--brand-ink);color:var(--brand)}
.combo .qty.has{background:var(--brand-ink);border-color:var(--brand-ink);color:var(--brand)}

/* Steps */
.steps{list-style:none;margin:0;padding:0;display:grid;gap:12px;grid-template-columns:1fr;counter-reset:s}
@media (min-width:700px){.steps{grid-template-columns:repeat(3,1fr)}}
.steps li{counter-increment:s;display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:start;padding:16px;border-radius:var(--r);background:var(--surface2);min-width:0}
.steps li::before{content:counter(s);font:800 20px/1 var(--display);width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--brand);color:var(--brand-ink)}
.steps b{display:block;font-size:16px}
.steps span{color:var(--muted);font-size:14px}

/* Reviews */
.rev-score{display:flex;flex-wrap:wrap;align-items:baseline;gap:10px;color:var(--muted);font-size:14px}
.rev-score b{font:800 40px/1 var(--display);color:var(--ink)}
.rev-list{display:grid;gap:12px;grid-template-columns:1fr}
@media (min-width:700px){.rev-list{grid-template-columns:repeat(3,1fr)}}
.rev{background:var(--surface);border:var(--bw) solid var(--line);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:10px;min-width:0}
.rev p{margin:0;font-size:15px}
.rev footer{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px;color:var(--muted);margin-top:auto}
.rev .who{display:flex;align-items:center;gap:8px}
.rev .ava{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:13px;background:var(--surface2);color:var(--ink)}
.rev footer b{color:var(--ink)}

/* Location */
.where{background:var(--surface);border:var(--bw) solid var(--line);border-radius:var(--r);overflow:hidden;display:grid;grid-template-columns:1fr}
@media (min-width:760px){.where{grid-template-columns:1.1fr 1fr}}
.map{position:relative;min-height:200px;background:var(--surface2);overflow:hidden}
.map svg{position:absolute;inset:0;width:100%;height:100%}
.where .body{padding:20px;display:grid;gap:14px;align-content:start}
.where p{margin:0;color:var(--muted)}
.where p b{color:var(--ink)}
.where .links{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hours{display:grid;grid-template-columns:auto 1fr;gap:4px 16px;font-size:14px;margin:0}
.hours dt{color:var(--muted)}
.hours dd{margin:0;font-weight:700;font-variant-numeric:tabular-nums}

footer.site{padding-block:36px 24px;color:var(--muted);font-size:13px;display:grid;gap:12px;border-top:var(--bw) solid var(--line);margin-top:48px}
footer.site .row{display:flex;flex-wrap:wrap;gap:8px 18px;justify-content:space-between}
footer.site a{font-weight:700;text-decoration:none;border-bottom:1.5px solid var(--line)}
footer.site summary{cursor:pointer;font-weight:700}
footer.site ul{margin:8px 0 0;padding-left:18px;display:grid;gap:2px}

/* Cart bar */
.bar{position:fixed;left:0;right:0;bottom:0;z-index:10;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(10px);
  border-top:var(--bw) solid var(--line);padding:10px 0 calc(10px + env(safe-area-inset-bottom,0px))}
.bar .wrap{display:grid;grid-template-columns:1fr 1fr;gap:10px;max-width:640px}
.bar .wrap.cart{grid-template-columns:1fr}
.cartbtn{justify-content:space-between}
.cartbtn .count{background:var(--brand-ink);color:var(--brand);border-radius:999px;min-width:28px;height:28px;display:grid;place-items:center;font-size:14px;font-weight:800;padding:0 8px}

/* Sheets */
.scrim{position:fixed;inset:0;z-index:20;background:rgba(10,12,10,.55)}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;background:var(--bg);border-radius:var(--r) var(--r) 0 0;max-height:90vh;overflow:auto;
  padding:8px 0 calc(16px + env(safe-area-inset-bottom,0px));box-shadow:0 -10px 40px rgba(0,0,0,.25);max-width:640px;margin-inline:auto}
.sheet .wrap{display:grid;gap:14px;max-width:640px}
.grab{width:44px;height:5px;border-radius:9px;background:var(--line);margin:4px auto 4px}
.sheet-head{display:flex;justify-content:space-between;align-items:center;gap:12px}
.sheet-head h2{font-size:24px}
.x{width:40px;height:40px;border-radius:50%;border:var(--bw) solid var(--line);background:var(--surface);cursor:pointer;font-size:20px;line-height:1;flex:none}
.lines{display:grid;gap:8px}
.line{display:grid;grid-template-columns:52px 1fr auto;gap:12px;align-items:center;background:var(--surface);border:var(--bw) solid var(--line);border-radius:var(--r-sm);padding:6px 8px 6px 6px}
.line .ph{width:52px;border-radius:calc(var(--r-sm) - 4px);cursor:default}
.line .nm{min-width:0;font-weight:700;font-size:15px;line-height:1.3}
.line .nm small{display:block;font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums}
.mode{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:var(--surface2);padding:4px;border-radius:var(--r-sm)}
.mode button{border:0;border-radius:calc(var(--r-sm) - 4px);padding:10px;font-weight:700;cursor:pointer;background:transparent}
.mode button[aria-pressed="true"]{background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.field{display:grid;gap:4px}
.field label{font-size:13px;font-weight:700;color:var(--muted)}
.field input,.field textarea{font:inherit;color:var(--ink);background:var(--surface);border:var(--bw) solid var(--line);border-radius:var(--r-sm);padding:12px 14px;width:100%}
.field input:focus,.field textarea:focus{outline:none;border-color:var(--brand)}
.field .err{color:var(--hot);font-size:13px;font-weight:600}
.sum{display:grid;grid-template-columns:1fr auto;gap:4px 12px;font-variant-numeric:tabular-nums}
.sum .t{font:800 20px var(--display)}
.sum span:nth-child(odd){color:var(--muted)}
.sum span.t{color:var(--ink)}
.hint{font-size:13px;color:var(--muted);margin:0}
.send{display:grid;grid-template-columns:1fr;gap:8px}

/* Product sheet */
.pd .big{width:100%;border-radius:var(--hero-r);cursor:default;aspect-ratio:1/1;max-height:52vh;margin-inline:auto}
:root[data-design="rishton"] .pd .big{border-radius:999px 999px var(--r) var(--r)}
.pd h2{font-size:28px}
.pd p{margin:0;color:var(--muted)}
.pd .buyrow{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:center}
.pd .stepper{display:flex;align-items:center;gap:4px;background:var(--surface);border:var(--bw) solid var(--line);border-radius:999px;padding:4px}
.pd .stepper button{width:42px;height:42px;border-radius:50%;border:0;background:var(--surface2);cursor:pointer;font-size:22px;font-weight:700}
.pd .stepper span{min-width:28px;text-align:center;font-weight:800;font-size:18px;font-variant-numeric:tabular-nums}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:30;
  background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:700;font-size:14px;white-space:nowrap}

/* Design-specific touches */
:root[data-design="olov"] .btn,:root[data-design="olov"] .fact,:root[data-design="olov"] .rev,:root[data-design="olov"] .where,
:root[data-design="olov"] .cats button,:root[data-design="olov"] .status,:root[data-design="olov"] .card,:root[data-design="olov"] .hit{border:var(--bw) solid var(--line)}
:root[data-design="olov"] .btn.primary,:root[data-design="olov"] .btn.accent{box-shadow:4px 4px 0 var(--line)}
:root[data-design="olov"] h1,:root[data-design="olov"] h2{text-transform:uppercase}
:root[data-design="olov"] .hero-photo .frame{border:var(--bw) solid var(--line);transform:rotate(-1.5deg)}
:root[data-design="olov"] .card .ph,:root[data-design="olov"] .line .ph{border:var(--bw) solid var(--line)}
:root[data-design="olov"] .hit .ph{border-bottom:var(--bw) solid var(--line)}
:root[data-design="olov"] .combo{border:var(--bw) solid var(--line);box-shadow:var(--shadow)}
:root[data-design="olov"] .combo .stack img,:root[data-design="olov"] .combo .stack .ph{border-radius:var(--ph-r);border-color:var(--brand-ink);transform:rotate(-4deg)}
:root[data-design="olov"] .combo .stack > :nth-child(2){transform:rotate(3deg)}
:root[data-design="olov"] .steps li{border:var(--bw) solid var(--line);background:var(--surface)}
:root[data-design="olov"] .sticker{border-radius:4px;width:auto;height:auto;padding:10px 12px;transform:rotate(-6deg);border:var(--bw) solid var(--line)}
:root[data-design="rishton"] .hero-photo{padding:14px}
:root[data-design="rishton"] .hero-photo::before{content:"";position:absolute;inset:0;border-radius:999px 999px 34px 34px;
  background:repeating-conic-gradient(from 0deg at 50% 38%,var(--brand) 0 6deg,var(--surface2) 6deg 12deg)}
:root[data-design="rishton"] .hero-photo .frame{box-shadow:0 0 0 6px var(--surface)}
:root[data-design="rishton"] .sticker{right:6px;top:auto;bottom:22%;border-radius:999px;width:auto;height:auto;padding:8px 14px;transform:none;background:var(--surface);color:var(--brand);font-size:14px}
:root[data-design="rishton"] .sticker small{display:inline;margin-left:4px}
:root[data-design="rishton"] h1 span{color:var(--brand);font-style:italic}
:root[data-design="rishton"] .demo{background:var(--brand);color:var(--brand-ink)}
:root[data-design="rishton"] .demo .seg button{color:var(--brand-ink)}
:root[data-design="rishton"] .demo .seg button[aria-pressed="true"]{background:var(--brand-ink);color:var(--brand)}
:root[data-design="rishton"] .combo{background:var(--brand) repeating-conic-gradient(from 45deg at 100% 0%,transparent 0 9deg,rgba(255,255,255,.07) 9deg 18deg)}
:root[data-design="rishton"] .menu-sec .sec-head{border-top:6px double var(--line);padding-top:16px}
:root[data-design="rishton"] .card .ph{border-radius:56px 56px 12px 12px}

/* Illustration fills (fallback when an item has no photo, and the map) */
.c-bg{fill:var(--surface2)} .c-brand{fill:var(--brand)} .c-acc{fill:var(--accent)} .c-hot{fill:var(--hot)}
.c-fill{fill:var(--fill)} .c-surf{fill:var(--surface)} .c-line{fill:none;stroke:var(--ink);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.c-bread{fill:#E4B46A} .c-bread2{fill:#C98B3D} .c-meat{fill:#7A3B22}

@media (prefers-reduced-motion:no-preference){
  .btn,.qty button,.stepper button{transition:transform .12s}
  .btn:active,.qty button:active,.stepper button:active{transform:scale(.96)}
  .card:hover .ph img,.hit:hover .ph img{transform:scale(1.05)}
  .sheet:not([hidden]){animation:up .24s cubic-bezier(.2,.8,.2,1)}
  @keyframes up{from{transform:translateY(40px);opacity:.5}to{transform:none;opacity:1}}
  .sticker{animation:wob 6s ease-in-out infinite}
  @keyframes wob{50%{rotate:-6deg}}
}
</style>
</head>

function tashkentMinutes() {
  var p = new Intl.DateTimeFormat("en-GB", { timeZone: "Asia/Tashkent", hour: "2-digit", minute: "2-digit", hour12: false }).formatToParts(new Date());
  var h = 0, m = 0; p.forEach(function (x) { if (x.type === "hour") h = +x.value % 24; if (x.type === "minute") m = +x.value; });
  return h * 60 + m;
}
function toMin(s) { var a = s.split(":"); return (+a[0]) * 60 + (+a[1]); }
function openState() {
  var h = CONFIG.hours; if (h.always) return { open: true };
  var now = tashkentMinutes(), f = toMin(h.from), to = toMin(h.to);
  var open = f < to ? (now >= f && now < to) : (now >= f || now < to);
  return { open: open, from: h.from };
}

  $("sum").innerHTML = "<span>" + esc(t("product")) + " · " + tt.count + " " + esc(t("items")) + "</span><span>" + money(tt.sub) + "</span>" +
    (state.mode === "delivery" ? "<span>" + esc(t("dfee")) + "</span><span>" + (tt.fee ? money(tt.fee) : esc(t("free"))) + "</span>" : "") +
    '<span class="t">' + esc(t("total")) + '</span><span class="t">' + money(tt.total) + "</span>";
}

function renderPd() {
  var it = ITEMS[state.pd]; if (!it) return;
  var cat = CAT_OF[it.id];
  $("pd-cat").textContent = cat ? L(cat.title) : t("comboEyebrow");
  $("pd-ph").outerHTML = photoHtml(it, { static: true, tag: true, cls: "big" }).replace('class="ph', 'id="pd-ph" class="ph');
  $("pd-h").textContent = L(it.name);
  $("pd-desc").textContent = L(it.desc);
  $("pd-n").textContent = state.pdN;
  $("pd-add").textContent = t("addToCart", { n: money(it.price * state.pdN) });
}

function refreshQty(id) {
  document.querySelectorAll('.qty[data-id="' + id + '"]').forEach(function (el) { el.outerHTML = qtyHtml(id); });
  renderBar();
  if (!$("sheet").hidden) { if (Object.keys(state.cart).length) renderSheet(); else closeSheets(); }
}

function renderAll() { renderStatic(); renderHits(); renderCombo(); renderCats(); renderMenu(); renderBar(); if (!$("sheet").hidden) renderSheet(); if (!$("pd").hidden) renderPd(); }

/* ================= Buyurtma matni ================= */
function orderText() {
  var tt = cartTotals(), lines = ["🧾 " + t("orderTitle") + " — " + CONFIG.name, ""];
  Object.keys(state.cart).forEach(function (id) { lines.push(state.cart[id] + " × " + L(ITEMS[id].name) + " — " + money(ITEMS[id].price * state.cart[id])); });
  lines.push("");
  if (state.mode === "delivery") lines.push(t("dfee") + ": " + (tt.fee ? money(tt.fee) : t("free")));
  lines.push(t("total") + ": " + money(tt.total), "");
  var name = $("o-name").value.trim(), phone = $("o-phone").value.trim(), addr = $("o-addr").value.trim(), note = $("o-note").value.trim();
  if (name) lines.push(t("nameLbl") + ": " + name);
  lines.push(t("phoneLbl") + ": " + phone);
  lines.push(state.mode === "delivery" ? t("addrLbl") + ": " + (addr || "—") : t("pickupMsg"));
  if (note) lines.push(t("noteLbl").replace(/\s*\(.*\)/, "") + ": " + note);
  return lines.join("\n");
}

var toastTimer;
function toast(msg) { var el = $("toast"); el.textContent = msg; el.hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(function () { el.hidden = true; }, 1800); }

/* ================= Oynalar ================= */
var opener = null;
function openSheet(id) {
  closeSheets(true);
  opener = document.activeElement;
  if (id === "sheet") renderSheet(); else renderPd();
  $(id).hidden = false; $("scrim").hidden = false;
  $(id).querySelector("[data-close]").focus();
}
function closeSheets(keepFocus) {
  $("sheet").hidden = true; $("pd").hidden = true; $("scrim").hidden = true;
  if (!keepFocus && opener && document.contains(opener)) opener.focus();
}

/* ================= Hodisalar ================= */
document.addEventListener("click", function (e) {
  var b = e.target.closest("button"); if (!b) return;
  if (b.closest("#designs")) { state.design = b.dataset.design; persist(); renderStatic(); return; }
  if (b.closest("#langs")) { state.lang = b.dataset.lang; persist(); renderAll(); return; }
  if (b.closest("#cats")) {
    state.cat = b.dataset.cat; renderCats();
    document.querySelectorAll("section.menu-sec").forEach(function (s) { s.hidden = state.cat !== "all" && s.dataset.cat !== state.cat; });
    return;
  }
  if (b.closest("#mode")) { state.mode = b.dataset.mode; renderSheet(); return; }
  if (b.hasAttribute("data-open")) { state.pd = b.getAttribute("data-open"); state.pdN = 1; openSheet("pd"); return; }
  if (b.hasAttribute("data-close")) { closeSheets(); return; }
  var q = b.closest(".qty");
  if (q) {
    var id = q.dataset.id, isPlus = b.classList.contains("plus"), n = (state.cart[id] || 0) + (isPlus ? 1 : -1);
    var idx = Array.prototype.indexOf.call(document.querySelectorAll('.qty[data-id="' + id + '"]'), q);
    if (n > 0) state.cart[id] = n; else delete state.cart[id];
    persist(); refreshQty(id);
    // keep keyboard focus on the same control without jumping the page
    var same = document.querySelectorAll('.qty[data-id="' + id + '"]')[idx];
    var target = same && same.querySelector(n > 0 && !isPlus ? ".minus" : ".plus");
    if (target) target.focus({ preventScroll: true });
    return;
  }
  if (b.id === "pd-minus" || b.id === "pd-plus") { state.pdN = Math.max(1, state.pdN + (b.id === "pd-plus" ? 1 : -1)); renderPd(); return; }
  if (b.id === "pd-add") {
    state.cart[state.pd] = (state.cart[state.pd] || 0) + state.pdN; persist();
    var pid = state.pd; closeSheets(); refreshQty(pid); toast(t("added")); return;
  }
  if (b.id === "open-cart") { openSheet("sheet"); return; }
  if (b.id === "copy-btn") {
    var txt = orderText();
    var done = function () { toast(t("copied")); };
    try { navigator.clipboard.writeText(txt).then(done, function () { fallbackCopy(txt); done(); }); } catch (err) { fallbackCopy(txt); done(); }
  }
});
function fallbackCopy(txt) { var ta = document.createElement("textarea"); ta.value = txt; document.body.appendChild(ta); ta.select(); try { document.execCommand("copy"); } catch (e) {} ta.remove(); }
$("scrim").addEventListener("click", function () { closeSheets(); });
document.addEventListener("keydown", function (e) { if (e.key === "Escape" && !$("scrim").hidden) closeSheets(); });
$("o-phone").addEventListener("input", function () { $("phone-err").hidden = true; });
$("order").addEventListener("submit", function (e) {
  e.preventDefault();
  var digits = $("o-phone").value.replace(/\D/g, "");
  if (digits.length < 9) { $("phone-err").hidden = false; $("o-phone").focus(); return; }
  var txt = orderText();
  try { navigator.clipboard.writeText(txt).catch(function () {}); } catch (err) {}
  var a = document.createElement("a");
  a.href = "https://t.me/share/url?url=" + encodeURIComponent(txt);
  a.target = "_blank"; a.rel = "noopener"; document.body.appendChild(a); a.click(); a.remove();
});

/* ================= Google uchun ma'lumot (Schema.org) ================= */
(function () {
  var ld = { "@context": "https://schema.org", "@type": "FastFoodRestaurant", name: CONFIG.name, telephone: CONFIG.phone,
    address: { "@type": "PostalAddress", streetAddress: CONFIG.text.uz.address, addressLocality: "Chinobod", addressRegion: "Andijon", addressCountry: "UZ" },
    hasMap: CONFIG.googleMaps, servesCuisine: "Fast food", priceRange: CONFIG.avgCheck + " 000 UZS",
    openingHours: CONFIG.hours.always ? "Mo-Su 00:00-23:59" : "Mo-Su " + CONFIG.hours.from + "-" + CONFIG.hours.to,
    aggregateRating: { "@type": "AggregateRating", ratingValue: CONFIG.rating, reviewCount: CONFIG.reviewsCount },
    hasMenu: { "@type": "Menu", hasMenuSection: CONFIG.menu.map(function (c) {
      return { "@type": "MenuSection", name: c.title.uz, hasMenuItem: c.items.map(function (it) {
        return { "@type": "MenuItem", name: it.name.uz, description: it.desc.uz, offers: { "@type": "Offer", price: it.price, priceCurrency: "UZS" } }; }) }; }) } };
  var s = document.createElement("script"); s.type = "application/ld+json"; s.textContent = JSON.stringify(ld); document.head.appendChild(s);
})();

renderAll();
setInterval(renderStatus, 60000);
</script>
</body>
